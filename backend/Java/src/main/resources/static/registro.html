<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GALAXY TRAVEL - REGISTRO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

   <header>
    <h1 class="logo-futurista">GALAXY TRAVEL</h1>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="destino.html">Destinos</a></li>
            <li><a href="registro.html">Registro</a></li>
        </ul>
    </nav>
</header>

    <main>
        <section>
            <h2>Crea tu Cuenta</h2>
            <p>Regístrate para empezar a reservar tus viajes soñados.</p>

            <form id="form-registro">

                <div class="campo-formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
                </div>

                <div class="campo-formulario">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Ej: Pérez" required>
                </div>

                <div class="campo-formulario">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo-formulario">
                    <label for="telefono">Teléfono:</label>
                    <input type="text" id="telefono" name="telefono" placeholder="Ej: 612345678">
                </div>

                <div class="campo-formulario">
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                <div class="campo-formulario">
                    <button type="submit">Registrarme</button>
                </div>

            </form>
            <p id="mensaje"></p>
            <p>¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>.</p> 
        </section>
    </main>

    <script src="api.js"></script>
    <script>
        document.getElementById("form-registro").addEventListener("submit", async function(e) {
            e.preventDefault();
            const mensaje = document.getElementById("mensaje");
            
            const data = {
                nombre: document.getElementById("nombre").value,
                apellidos: document.getElementById("apellidos").value,
                email: document.getElementById("email").value,
                telefono: document.getElementById("telefono").value,
                fechaNacimiento: document.getElementById("fechaNacimiento").value,
                pasaporte: {
                    numero: "",
                    paisExpedicion: "",
                    fechaCaducidad: "2030-01-01"
                }
            };

            try {
                const response = await createUsuario(data);
                if (response.ok) {
                    mensaje.textContent = "¡Registro exitoso!";
                    mensaje.style.color = "green";
                    this.reset();
                } else {
                    mensaje.textContent = "Error al registrar";
                    mensaje.style.color = "red";
                }
            } catch (e) {
                mensaje.textContent = "Error de conexión";
                mensaje.style.color = "red";
            }
        });
    </script>

    <footer>
        <p>&copy; 2026 Proyecto Intermodular DAW Semi. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
