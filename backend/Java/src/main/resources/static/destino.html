<!DOCTYPE html>
<html lang="es"> <head>
    <meta charset="UTF-8">
    <title>GALAXY TRAVEL - DESTINOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header>
        <h1 class="logo-futurista">GALAXY TRAVEL</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destino.html">Destinos</a></li>
                <li><a href="registro.html">Registro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crear Nuevo Destino</h2>
            <form id="form-destino">
                <div class="campo-formulario">
                    <label for="ciudad">Ciudad:</label>
                    <input type="text" id="ciudad" name="ciudad" required>
                </div>
                <div class="campo-formulario">
                    <label for="pais">País/Planeta:</label>
                    <input type="text" id="pais" name="pais" required>
                </div>
                <div class="campo-formulario">
                    <label for="precio">Precio (฿):</label>
                    <input type="number" id="precio" name="precio" min="0" required>
                </div>
                <div class="campo-formulario">
                    <label>
                        <input type="checkbox" id="requiere_pasaporte" name="requiere_pasaporte">
                        ¿Requiere Pasaporte?
                    </label>
                </div>
                <button type="submit">Añadir Destino</button>
                <p id="mensaje-crear"></p>
            </form>
        </section>

        <h2 class="titulo-seccion">Explora el Sistema Solar</h2>
        
        <section class="contenedor-destinos" id="contenedor-destinos">
            <p>Cargando destinos...</p>
        </section>
    </main>

    <script src="api.js"></script>
    <script>
        document.getElementById('form-destino').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje-crear');

            const destino = {
                ciudad: document.getElementById('ciudad').value,
                pais: document.getElementById('pais').value,
                precio: parseFloat(document.getElementById('precio').value),
                requierePasaporte: document.getElementById('requiere_pasaporte').checked
            };

            try {
                await crearDestino(destino);
                mensaje.textContent = '¡Destino creado con éxito!';
                mensaje.style.color = 'green';
                document.getElementById('form-destino').reset();
                cargarDestinos();
            } catch (error) {
                mensaje.textContent = 'Error al crear destino.';
                mensaje.style.color = 'red';
            }
        });

        async function cargarDestinos() {
            const container = document.getElementById("contenedor-destinos");
            try {
                const destinos = await getDestinos();
                container.innerHTML = "";
                if (!destinos || destinos.length === 0) {
                    container.innerHTML = "<p>No hay destinos disponibles</p>";
                    return;
                }
                destinos.forEach(destino => {
                    const card = document.createElement("article");
                    card.className = "tarjeta-destino";
                    card.innerHTML = `
                        <section class="info-destino">
                            <h3>${destino.ciudad}, ${destino.pais}</h3>
                            <p>Precio: ${destino.precio} ฿</p>
                            <p>Requiere pasaporte: ${destino.requierePasaporte ? "Sí" : "No"}</p>
                            <button type="button" class="btn-reserva" onclick="reservar(${destino.id})">Reservar Plaza</button>
                        </section>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = "<p>Error al cargar destinos</p>";
            }
        }
        function reservar(id) {
            alert("Reserva ID: " + id);
        }
        cargarDestinos();
    </script>

    <footer>
        <p>&copy; 2026 Galaxy Travel - Terminal de Control de Pasajeros</p>
    </footer>

</body>
</html>
