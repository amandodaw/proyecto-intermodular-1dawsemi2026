<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALAXY TRAVEL - ALTA DESTINO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="images/logo.png" alt="Logo Galaxy Travel" class="logo-icono">
            <h1 class="logo-futurista">GALAXY TRAVEL</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="viajes.html">Viajes</a></li>
                <li><a href="destino.html">Destinos</a></li>
                <li><a href="guias.html">Guías</a></li>
                
            </ul>
        </nav>
    </header>

    <main>
        <div class="seccion-fondo-universo">
            <section class="contenedor-formulario">
                <form id="form-destino" action="/api/destino" method="POST">
                    <fieldset>
                        <legend>Creación de Nuevo Destino</legend>
                        <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad" required>

                        <label for="pais">País (o Planeta):</label>
                        <input type="text" id="pais" name="pais" required>

                        <label for="precio">Precio (฿):</label>
                        <input type="number" id="precio" name="precio" min="0" required>

                        <!-- Control booleano[cite: 1, 5] -->
                        <label>
                            <input type="checkbox" id="requiere_pasaporte" name="requiere_pasaporte">
                            ¿Requiere Pasaporte?
                        </label>
                    </fieldset>

                    <button type="submit" class="btn-cohete">Añadir Destino</button>
                </form>
            </section>
        </div>
    </main>


    <script src="api.js"></script>
    <script>
        async function cargarDestinos() {
            const container = document.getElementById('destinosContainer');
            try {
                const destinos = await getDestinos();
                container.innerHTML = '';
                
                if (destinos.length === 0) {
                    container.innerHTML = '<p>No hay destinos disponibles.</p>';
                    return;
                }

                destinos.forEach(destino => {
                    const card = document.createElement('article');
                    card.className = 'tarjeta-destino';
                    card.innerHTML = `
                        <section class="info-destino">
                            <h3>${destino.ciudad}, ${destino.pais}</h3>
                            <p class="precio">Desde ${destino.precio} ฿</p>
                            <p>${destino.requierePasaporte ? 'Se requiere pasaporte' : 'No requiere pasaporte'}</p>
                            <button type="button" class="btn-reserva" onclick="reservarDestino(${destino.id})">Reservar Plaza</button>
                        </section>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<p>Error al cargar destinos.</p>';
            }
        }

        function reservarDestino(idDestino) {
            alert('Reserva iniciada para destino ID: ' + idDestino);
        }

        cargarDestinos();
    </script>

    <footer>
        <address>
            <p>Galaxy Travel - Base Espacial Benidorm</p>
            <p>Contacto: <a href="mailto:info@galaxytravel.com">info@galaxytravel.com</a></p>
        </address>
        <p>&copy; 2026 Galaxy Travel. Todos los derechos reservados &reg;</p>
    </footer>
</body>
</html>
