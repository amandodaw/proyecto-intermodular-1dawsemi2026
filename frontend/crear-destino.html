<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GALAXY TRAVEL - CREAR DESTINO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1 class="logo-futurista">GALAXY TRAVEL</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destino.html">Destinos</a></li>
                <li><a href="listados-destinos.html">Listados</a></li>
                <li><a href="crear-destino.html">Crear Destino</a></li>
                <li><a href="crear-guia.html">Crear Guía</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="inscribir.html">Inscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crear Nuevo Destino</h2>
            <p>Agrega un nuevo destino turístico al sistema.</p>

            <form id="destinoForm">
                <fieldset>
                    <legend>Datos del Destino</legend>
                    
                    <div class="campo-formulario">
                        <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad" placeholder="Ej: Marte" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="pais">País/Planeta:</label>
                        <input type="text" id="pais" name="pais" placeholder="Ej: Sistema Solar" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="precio">Precio (฿):</label>
                        <input type="number" id="precio" name="precio" min="0" step="0.01" placeholder="Ej: 2500" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="requierePasaporte">
                            <input type="checkbox" id="requierePasaporte" name="requierePasaporte">
                            ¿Requiere Pasaporte?
                        </label>
                    </div>

                    <div class="campo-formulario">
                        <button type="submit">Crear Destino</button>
                    </div>
                </fieldset>
            </form>
            <p id="mensaje"></p>
        </section>
    </main>

    <script src="api.js"></script>
    <script>
        document.getElementById('destinoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            
            const destino = {
                ciudad: document.getElementById('ciudad').value,
                pais: document.getElementById('pais').value,
                precio: parseFloat(document.getElementById('precio').value),
                requierePasaporte: document.getElementById('requierePasaporte').checked
            };

            try {
                await crearDestino(destino);
                mensaje.textContent = '¡Destino creado con éxito!';
                mensaje.style.color = 'green';
                document.getElementById('destinoForm').reset();
            } catch (error) {
                mensaje.textContent = 'Error al crear destino. Intenta de nuevo.';
                mensaje.style.color = 'red';
            }
        });
    </script>

    <footer>
        <p>&copy; 2026 Galaxy Travel - Terminal de Control de Pasajeros</p>
    </footer>

</body>
</html>
