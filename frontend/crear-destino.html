<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALAXY TRAVEL - CREAR DESTINO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="images/logo.png" alt="Logo Galaxy Travel" class="logo-icono">
            <h1 class="logo-futurista">GALAXY TRAVEL</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destino.html">Destinos</a></li>
                <li><a href="listados-usuarios.html">Usuarios</a></li>
                <li><a href="crear-destino.html">Crear destino</a></li>
                <li><a href="crear-guia.html">Crear guía</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="inscribir.html">Inscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="seccion-fondo-universo">
            <section class="contenedor-formulario">
                <form id="form-destino" action="/api/destino" method="POST">
                    <fieldset>
                        <legend>Creación de Nuevo Destino</legend>
                        <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad" required>

                        <label for="pais">País (o Planeta):</label>
                        <input type="text" id="pais" name="pais" required>

                        <label for="precio">Precio (฿):</label>
                        <input type="number" id="precio" name="precio" min="0" required>

                        <label>
                            <input type="checkbox" id="requiere_pasaporte" name="requiere_pasaporte">
                            ¿Requiere Pasaporte?
                        </label>
                    </fieldset>

                    <button type="submit" class="btn-cohete">Añadir Destino</button>
                    <p id="mensaje-form"></p>
                </form>
            </section>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        document.getElementById('form-destino').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje-form');

            const destino = {
                ciudad: document.getElementById('ciudad').value,
                pais: document.getElementById('pais').value,
                precio: parseFloat(document.getElementById('precio').value),
                requierePasaporte: document.getElementById('requiere_pasaporte').checked
            };

            try {
                await crearDestino(destino);
                mensaje.textContent = '¡Destino añadido con éxito!';
                mensaje.style.color = 'green';
                document.getElementById('form-destino').reset();
            } catch (error) {
                mensaje.textContent = 'Error al añadir destino.';
                mensaje.style.color = 'red';
            }
        });
    </script>

    <footer>
        <address>
            <p>Galaxy Travel - Base Espacial Benidorm</p>
            <p>Contacto: <a href="mailto:info@galaxytravel.com">info@galaxytravel.com</a></p>
        </address>
        <p>&copy; 2026 Galaxy Travel. Todos los derechos reservados &reg;</p>
    </footer>
</body>
</html>
