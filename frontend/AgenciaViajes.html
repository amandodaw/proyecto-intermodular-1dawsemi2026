<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Agencia de Viajes</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1 class="logo-futurista">GALAXY TRAVEL</h1>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="registro.html">Registro</a></li>
        </ul>
    </nav>
</header>

    <main>
        <section>
            <h2>Crea tu Cuenta</h2>
            <p>Regístrate para empezar a reservar tus viajes soñados.</p>

            <form action="#" method="post">

                <div class="campo-formulario">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre_usuario" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="campo-formulario">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email_usuario" required>
                </div>

                <div class="campo-formulario">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="pass_usuario" required>
                </div>

                <div class="campo-formulario">
                    <button type="submit">Registrarme</button>
                </div>

            </form>
            <p>¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>.</p> </section>
    </main>

    <footer>
        <p>&copy; 2026 Proyecto Intermodular DAW Semi. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
